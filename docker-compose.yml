services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sige_panel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sige_panel}
      POSTGRES_DB: ${POSTGRES_DB:-sige_panel}
    ports:
      - '5433:5432'
    volumes:
      - panel_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sige_panel} -d ${POSTGRES_DB:-sige_panel}']
      interval: 5s
      timeout: 5s
      retries: 10

  panel:
    build:
      context: .
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sige_panel:sige_panel@postgres:5432/sige_panel}
      PANEL_SECRETS_KEY: ${PANEL_SECRETS_KEY:-change-me-32-char-panel-secrets-key}
      SUPERADMIN_JWT_SECRET: ${SUPERADMIN_JWT_SECRET:-change-me-superadmin-jwt-secret-min-32-chars}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SUPERADMIN_ALLOWED_EMAILS: ${SUPERADMIN_ALLOWED_EMAILS:-admin@example.com}
      PANEL_ORIGIN: ${PANEL_ORIGIN:-http://localhost:3001}
      NODE_ENV: production
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  panel_postgres_data:
