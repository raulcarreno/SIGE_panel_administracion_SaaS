# Cloud Build for SIGE Superadmin Panel
# Substitutions: _IMAGE, _VITE_GOOGLE_CLIENT_ID
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - VITE_GOOGLE_CLIENT_ID=${_VITE_GOOGLE_CLIENT_ID}
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
substitutions:
  _IMAGE: europe-southwest1-docker.pkg.dev/findspo-core/fraian-saas/sige-panel:dev
  _VITE_GOOGLE_CLIENT_ID: ''
options:
  logging: CLOUD_LOGGING_ONLY
