openapi: 3.0.3
info:
  title: SIGE Superadmin Panel API
  version: 1.0.0
  description: Internal API for the central superadmin panel.
servers:
  - url: http://localhost:3001
security:
  - PanelBearer: []
components:
  securitySchemes:
    PanelBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TenantRuntimeService:
      type: object
      properties:
        status:
          type: string
          enum: [ready, crash, pending, unhealthy, missing, unknown]
        deployment:
          type: object
          nullable: true
          properties:
            name:
              type: string
            replicas:
              type: integer
            readyReplicas:
              type: integer
            availableReplicas:
              type: integer
            image:
              type: string
              nullable: true
        pods:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              component:
                type: string
              phase:
                type: string
              ready:
                type: boolean
              restarts:
                type: integer
              image:
                type: string
                nullable: true
              node:
                type: string
                nullable: true
              startedAt:
                type: string
                nullable: true
              containerName:
                type: string
                nullable: true
              reason:
                type: string
                nullable: true
        app:
          type: object
          properties:
            reachable:
              type: boolean
            ok:
              type: boolean
            error:
              type: string
              nullable: true
    TenantRuntimeEvent:
      type: object
      properties:
        type:
          type: string
        reason:
          type: string
        message:
          type: string
        object:
          type: string
        count:
          type: integer
        lastTimestamp:
          type: string
          nullable: true
paths:
  /api/superadmin/public-config:
    get:
      summary: Public bootstrap config for login UI
      security: []
      responses:
        '200':
          description: Google client ID
  /api/superadmin/login:
    post:
      summary: Google OAuth login
      security: []
      responses:
        '200':
          description: JWT token
  /api/superadmin/dashboard:
    get:
      summary: Dashboard stats
      responses:
        '200':
          description: Stats
  /api/superadmin/tenants:
    get:
      summary: List tenants
      responses:
        '200':
          description: Tenant list
    post:
      summary: Register tenant (URLs derived from slug SaaS hosts when omitted)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [slug, controlToken]
              properties:
                slug:
                  type: string
                displayName:
                  type: string
                controlToken:
                  type: string
                baseUrl:
                  type: string
                  description: Optional override; default https://erp.<slug>.findspo.com
                webBaseUrl:
                  type: string
                  description: Optional override; default https://www.<slug>.findspo.com
                provisionDomains:
                  type: boolean
                  description: If true, run full-auto DNS/Ingress/cert after create
      responses:
        '201':
          description: Created tenant
  /api/superadmin/tenants/sync-all:
    post:
      summary: Sync all tenants
      responses:
        '200':
          description: Sync results
  /api/superadmin/tenants/{id}:
    get:
      summary: Tenant detail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tenant
    patch:
      summary: Update tenant registry metadata
      responses:
        '200':
          description: Updated tenant
    delete:
      summary: Archive tenant
      responses:
        '200':
          description: Archived tenant
  /api/superadmin/tenants/{id}/sync:
    post:
      summary: Sync tenant status from pod
      responses:
        '200':
          description: Sync result
  /api/superadmin/tenants/{id}/config:
    get:
      summary: Proxy GET /api/control/config
      responses:
        '200':
          description: Config
    put:
      summary: Proxy PUT /api/control/config
      responses:
        '200':
          description: Updated config
  /api/superadmin/tenants/{id}/settings:
    get:
      summary: Proxy GET /api/control/settings
      responses:
        '200':
          description: Settings
    put:
      summary: Proxy PUT /api/control/settings
      responses:
        '200':
          description: Updated settings
  /api/superadmin/tenants/{id}/migrations:
    get:
      summary: Proxy GET /api/control/migrations
      responses:
        '200':
          description: Migrations
  /api/superadmin/tenants/{id}/migrations/run:
    post:
      summary: Proxy POST /api/control/migrations/run
      responses:
        '200':
          description: Migration result
  /api/superadmin/tenants/{id}/maintenance:
    post:
      summary: Proxy POST /api/control/maintenance
      responses:
        '200':
          description: Maintenance state
  /api/superadmin/tenants/{id}/audit:
    get:
      summary: Panel audit log for tenant
      responses:
        '200':
          description: Audit entries
  /api/superadmin/tenants/{id}/runtime:
    get:
      summary: Cluster workload status and app health for tenant ERP + Web
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Runtime snapshot (cluster may be unavailable in local dev)
          content:
            application/json:
              schema:
                type: object
                required: [slug, clusterAvailable, services, events]
                properties:
                  slug:
                    type: string
                  clusterAvailable:
                    type: boolean
                  clusterError:
                    type: string
                    nullable: true
                  clusterErrorCode:
                    type: string
                    nullable: true
                  services:
                    type: object
                    required: [erp, web]
                    properties:
                      erp:
                        $ref: '#/components/schemas/TenantRuntimeService'
                      web:
                        $ref: '#/components/schemas/TenantRuntimeService'
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/TenantRuntimeEvent'
        '404':
          description: Tenant not found
  /api/superadmin/tenants/{id}/runtime/logs:
    get:
      summary: Recent container logs for a tenant component (ERP or Web)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: component
          required: true
          schema:
            type: string
            enum: [erp, web]
        - in: query
          name: tailLines
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
        - in: query
          name: previous
          schema:
            type: boolean
            default: false
          description: Read logs from the previous terminated container (crash)
      responses:
        '200':
          description: Log text for the newest pod of the component
          content:
            application/json:
              schema:
                type: object
                required: [component, podName, container, tailLines, previous, logs]
                properties:
                  component:
                    type: string
                    enum: [erp, web]
                  podName:
                    type: string
                  container:
                    type: string
                  tailLines:
                    type: integer
                  previous:
                    type: boolean
                  previousMissing:
                    type: boolean
                  logs:
                    type: string
        '400':
          description: Invalid component or query
        '404':
          description: Tenant or pod not found
        '503':
          description: Kubernetes API unavailable or forbidden
  /api/superadmin/tenants/{id}/domains:
    get:
      summary: SaaS + custom domain status for tenant
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Domain status, custom domains, jobs, Ingress IP
  /api/superadmin/tenants/{id}/domains/provision:
    post:
      summary: Apply GKE Ingress + ManagedCertificate; returns manual IONOS DNS instructions
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ingress/cert applied plus manual A-record instructions
        '503':
          description: Ingress IP unavailable
  /api/superadmin/tenants/{id}/domains/custom:
    post:
      summary: Register a custom domain (pending DNS verification)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, hostname]
              properties:
                kind:
                  type: string
                  enum: [erp, web]
                hostname:
                  type: string
                  example: www.cliente.com
      responses:
        '201':
          description: Custom domain registered with CNAME instructions
  /api/superadmin/tenants/{id}/domains/custom/{domainId}/verify:
    post:
      summary: Verify DNS and add host to Ingress + ManagedCertificate
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: domainId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Verified and provisioned
        '400':
          description: DNS not pointing to expected target
  /api/superadmin/tenants/{id}/domains/custom/{domainId}:
    delete:
      summary: Remove custom domain from registry and re-apply Ingress/cert
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: domainId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Removed
